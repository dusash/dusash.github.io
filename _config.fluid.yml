# ==============================================
# Fluid 主题配置
# 这里只写「和主题默认值不一样」的部分，其余全部沿用
# 默认值。想改什么先在这里加，不要动 node_modules 里的文件。
# 主题完整默认值：node_modules/hexo-theme-fluid/_config.yml
# 中文文档：https://hexo.fluid-dev.com/docs/
# ==============================================

# ---------- 导航栏 ----------
navbar:
  blog_title: "dusash 的博客"
  menu:
    - { key: "home", link: "/", icon: "iconfont icon-home-fill" }
    - { key: "archive", link: "/archives/", icon: "iconfont icon-archive-fill" }
    - { key: "category", link: "/categories/", icon: "iconfont icon-category-fill" }
    - { key: "tag", link: "/tags/", icon: "iconfont icon-tags-fill" }
    - { key: "about", link: "/about/", icon: "iconfont icon-user-fill" }

# ---------- 明暗模式 ----------
# 默认浅色；右上角保留一个切换按钮，访客可以自己切暗色
dark_mode:
  enable: true
  default: light

# ---------- 首页 ----------
index:
  slogan:
    enable: true
    text: "记录一些还在长的东西"

# ---------- 关于页 ----------
about:
  enable: true
  name: "dusash"
  intro: "长江大学 · 正在学写代码"
  icons:
    - { class: "iconfont icon-github-fill", link: "https://github.com/", tip: "GitHub" }
