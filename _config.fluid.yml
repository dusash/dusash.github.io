# ==============================================
# Fluid 主题配置（wallpaper 分支）
# 只写「和主题默认值不一样」的部分，其余沿用默认。
# 完整默认值：node_modules/hexo-theme-fluid/_config.yml
# ==============================================

# ---------- 导航栏 ----------
navbar:
  blog_title: "dusash"
  menu:
    - { key: "home", link: "/", icon: "iconfont icon-home-fill" }
    - { key: "archive", link: "/archives/", icon: "iconfont icon-archive-fill" }
    - { key: "category", link: "/categories/", icon: "iconfont icon-category-fill" }
    - { key: "tag", link: "/tags/", icon: "iconfont icon-tags-fill" }
    - { key: "about", link: "/about/", icon: "iconfont icon-user-fill" }

# ---------- 明暗：固定深色，切换按钮已在 CSS 里隐藏 ----------
dark_mode:
  enable: true
  default: dark

# ---------- 配色：取自壁纸（墨黑 / 门框绿 / 门内红） ----------
color:
  body_bg_color: "#050607"
  body_bg_color_dark: "#050607"
  navbar_bg_color: "#050607"
  navbar_bg_color_dark: "#050607"
  navbar_text_color: "#e8eaed"
  navbar_text_color_dark: "#e8eaed"
  subtitle_color: "#9aa3ab"
  subtitle_color_dark: "#9aa3ab"
  text_color: "#c6ccd4"
  text_color_dark: "#c6ccd4"
  sec_text_color: "#767d85"
  sec_text_color_dark: "#767d85"
  board_color: "#0a0c0d"
  board_color_dark: "#0a0c0d"
  post_text_color: "#c6ccd4"
  post_text_color_dark: "#c6ccd4"
  post_heading_color: "#e8eaed"
  post_heading_color_dark: "#e8eaed"
  post_link_color: "#4ade80"
  post_link_color_dark: "#4ade80"
  link_hover_color: "#86efac"
  link_hover_color_dark: "#86efac"
  link_hover_bg_color: "rgba(74,222,128,0.08)"
  link_hover_bg_color_dark: "rgba(74,222,128,0.08)"
  line_color: "rgba(255,255,255,0.08)"
  line_color_dark: "rgba(255,255,255,0.08)"
  scrollbar_color: "#262b31"
  scrollbar_color_dark: "#262b31"
  scrollbar_hover_color: "#3a4149"
  scrollbar_hover_color_dark: "#3a4149"
  button_bg_color: "transparent"
  button_bg_color_dark: "transparent"
  button_hover_bg_color: "rgba(255,255,255,0.06)"
  button_hover_bg_color_dark: "rgba(255,255,255,0.06)"

# ---------- 首页 ----------
banner:
  parallax: false

index:
  banner_img: /img/hero-poster.jpg
  banner_img_height: 100
  banner_mask_alpha: 0
  slogan:
    enable: true
    text: "Welcome to my blog."

# ---------- 文章页 / 普通页 ----------
post:
  banner_img: /img/hero-poster.jpg
  banner_img_height: 46
  banner_mask_alpha: 0.55

page:
  banner_img: /img/hero-poster.jpg
  banner_img_height: 100
  banner_mask_alpha: 0.55

archive:
  banner_img: /img/hero-poster.jpg
  banner_img_height: 100
  banner_mask_alpha: 0.55

category:
  enable: true
  banner_img: /img/hero-poster.jpg
  banner_img_height: 100
  banner_mask_alpha: 0.55

tag:
  enable: true
  banner_img: /img/hero-poster.jpg
  banner_img_height: 100
  banner_mask_alpha: 0.55

# ---------- 关于页 ----------
about:
  enable: true
  banner_img: /img/hero-poster.jpg
  banner_img_height: 100
  banner_mask_alpha: 0.55
  avatar: /img/avatar.png
  name: "dusash"
  intro: "Yangtze University"
  icons: []

# ---------- 自定义资源 ----------
custom_css: /css/custom.css
custom_js: /js/hero-video.js
