# ==============================================
# Fluid 主题配置
# 只写「和主题默认值不一样」的部分，其余沿用默认。
# 完整默认值：node_modules/hexo-theme-fluid/_config.yml
# ==============================================

# ---------- 导航栏 ----------
navbar:
  blog_title: "dusash"
  menu:
    - { key: "home", link: "/", icon: "iconfont icon-home-fill" }
    - { key: "archive", link: "/archives/", icon: "iconfont icon-archive-fill" }
    - { key: "category", link: "/categories/", icon: "iconfont icon-category-fill" }
    - { key: "tag", link: "/tags/", icon: "iconfont icon-tags-fill" }
    - { key: "about", link: "/about/", icon: "iconfont icon-user-fill" }
    - { key: "workbench", name: "工作台", link: "/workbench/", icon: "iconfont icon-app-fill" }

# ---------- 明暗：固定深色，切换按钮已在 CSS 里隐藏 ----------
dark_mode:
  enable: true
  default: dark

# ---------- 配色：墨黑 / 鼠尾草绿 / 暖白 ----------
color:
  body_bg_color: "#080a09"
  body_bg_color_dark: "#080a09"
  navbar_bg_color: "#080a09"
  navbar_bg_color_dark: "#080a09"
  navbar_text_color: "#f0f2eb"
  navbar_text_color_dark: "#f0f2eb"
  subtitle_color: "#c8d0c7"
  subtitle_color_dark: "#c8d0c7"
  text_color: "#c8d0c7"
  text_color_dark: "#c8d0c7"
  sec_text_color: "#939e94"
  sec_text_color_dark: "#939e94"
  board_color: "#111611"
  board_color_dark: "#111611"
  post_text_color: "#c8d0c7"
  post_text_color_dark: "#c8d0c7"
  post_heading_color: "#f0f2eb"
  post_heading_color_dark: "#f0f2eb"
  post_link_color: "#9fc9a8"
  post_link_color_dark: "#9fc9a8"
  link_hover_color: "#c0e4c7"
  link_hover_color_dark: "#c0e4c7"
  link_hover_bg_color: "rgba(159,201,168,0.09)"
  link_hover_bg_color_dark: "rgba(159,201,168,0.09)"
  line_color: "rgba(224,235,222,0.12)"
  line_color_dark: "rgba(224,235,222,0.12)"
  scrollbar_color: "#29322b"
  scrollbar_color_dark: "#29322b"
  scrollbar_hover_color: "#435047"
  scrollbar_hover_color_dark: "#435047"
  button_bg_color: "transparent"
  button_bg_color_dark: "transparent"
  button_hover_bg_color: "rgba(159,201,168,0.09)"
  button_hover_bg_color_dark: "rgba(159,201,168,0.09)"

# ---------- 首页 ----------
banner:
  parallax: false

# 关闭主题打字插件，由自定义脚本提供可减少动态效果的轻量版本。
fun_features:
  typing:
    enable: false

index:
  banner_img: /img/hero-poster.jpg
  banner_img_height: 94
  banner_mask_alpha: 0
  slogan:
    enable: true
    text: "Welcome to my blog."

# ---------- 文章页 / 普通页 ----------
post:
  banner_img: /img/hero-poster.jpg
  banner_img_height: 58
  banner_mask_alpha: 0.55

page:
  banner_img: /img/hero-poster.jpg
  banner_img_height: 54
  banner_mask_alpha: 0.55

archive:
  banner_img: /img/hero-poster.jpg
  banner_img_height: 54
  banner_mask_alpha: 0.55

category:
  enable: true
  banner_img: /img/hero-poster.jpg
  banner_img_height: 54
  banner_mask_alpha: 0.55

tag:
  enable: true
  banner_img: /img/hero-poster.jpg
  banner_img_height: 54
  banner_mask_alpha: 0.55

# ---------- 关于页 ----------
about:
  enable: true
  banner_img: /img/hero-poster.jpg
  banner_img_height: 52
  banner_mask_alpha: 0.55
  avatar: /img/avatar.png
  name: "dusash"
  intro: "Yangtze University"
  icons: []

# ---------- 自定义资源 ----------
custom_css: /css/custom.css
custom_js: /js/hero-video.js
