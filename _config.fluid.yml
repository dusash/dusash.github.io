# ==============================================
# Fluid 主题配置
# 只写「和主题默认值不一样」的部分，其余沿用默认。
# 完整默认值：node_modules/hexo-theme-fluid/_config.yml
# 中文文档：https://hexo.fluid-dev.com/docs/
# ==============================================

# ---------- 图标 ----------
favicon: /img/favicon.png
apple_touch_icon: /img/favicon.png

# ---------- 导航栏 ----------
navbar:
  blog_title: "dusash"
  menu:
    - { key: "home", link: "/", icon: "iconfont icon-home-fill" }
    - { key: "archive", link: "/archives/", icon: "iconfont icon-archive-fill" }
    - { key: "category", link: "/categories/", icon: "iconfont icon-category-fill" }
    - { key: "tag", link: "/tags/", icon: "iconfont icon-tags-fill" }
    - { key: "about", link: "/about/", icon: "iconfont icon-user-fill" }

# ---------- 明暗：固定深色，切换按钮已在 CSS 里隐藏 ----------
dark_mode:
  enable: true
  default: dark

# ---------- 配色：壁纸的墨黑 + 门缝的绿 + 门里的红 ----------
color:
  body_bg_color: "#060709"
  body_bg_color_dark: "#060709"
  navbar_bg_color: "#060709"
  navbar_bg_color_dark: "#060709"
  navbar_text_color: "#e8eaed"
  navbar_text_color_dark: "#e8eaed"
  subtitle_color: "#a8b0bd"
  subtitle_color_dark: "#a8b0bd"
  text_color: "#c9ced6"
  text_color_dark: "#c9ced6"
  sec_text_color: "#787f8a"
  sec_text_color_dark: "#787f8a"
  board_color: "#0b0d10"
  board_color_dark: "#0b0d10"
  post_text_color: "#c9ced6"
  post_text_color_dark: "#c9ced6"
  post_heading_color: "#e8eaed"
  post_heading_color_dark: "#e8eaed"
  post_link_color: "#4ade80"
  post_link_color_dark: "#4ade80"
  link_hover_color: "#86efac"
  link_hover_color_dark: "#86efac"
  link_hover_bg_color: "rgba(74,222,128,0.08)"
  link_hover_bg_color_dark: "rgba(74,222,128,0.08)"
  line_color: "rgba(255,255,255,0.09)"
  line_color_dark: "rgba(255,255,255,0.09)"
  scrollbar_color: "#2a2f36"
  scrollbar_color_dark: "#2a2f36"
  scrollbar_hover_color: "#3d444d"
  scrollbar_hover_color_dark: "#3d444d"
  button_bg_color: "transparent"
  button_bg_color_dark: "transparent"
  button_hover_bg_color: "rgba(255,255,255,0.06)"
  button_hover_bg_color_dark: "rgba(255,255,255,0.06)"

# ---------- 首页 ----------
banner:
  parallax: false

index:
  banner_img: /img/hero.jpg
  banner_img_height: 100
  banner_mask_alpha: 0
  slogan:
    enable: true
    text: "门开着，光是绿的。"

# ---------- 关于页 ----------
about:
  enable: true
  avatar: /img/avatar.png
  name: "dusash"
  intro: "长江大学 · 正在学写代码"
  icons:
    - { class: "iconfont icon-github-fill", link: "https://github.com/dusash", tip: "GitHub" }

# ---------- 文章页 / 普通页 ----------
post:
  banner_img: /img/hero.jpg
  banner_img_height: 52
  banner_mask_alpha: 0.45

page:
  banner_img: /img/hero.jpg
  banner_img_height: 42
  banner_mask_alpha: 0.45

# ---------- 自定义样式 ----------
custom_css: /css/custom.css
