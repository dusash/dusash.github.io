# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# Site
title: dusash 的博客
subtitle: '记录一些还在长的东西'
description: 'dusash 的个人博客，写学习、写想法，也写还没想明白的事。'
keywords: 博客,记录,学习,随笔
author: dusash
language: zh-CN
timezone: 'Asia/Shanghai'

# URL
## 部署到 GitHub Pages 后，把下面的地址换成你的真实地址
url: https://dusash.github.io
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true
  trailing_html: true

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  preprocess: true
  line_number: true
  tab_replace: ''

# Home page setting
index_generator:
  path: ''
  per_page: 8
  order_by: -date

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Metadata elements
meta_generator: true

# Date / Time format
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: 'mtime'

# Pagination
per_page: 8
pagination_dir: page

# Include / Exclude file(s)
include:
exclude:
ignore:

# Extensions
theme: fluid

# 站内搜索（配合 hexo-generator-search + Fluid 搜索框）
search:
  path: local-search.xml
  field: post
  content: true

# Deployment
## 本地部署命令：npx hexo clean && npx hexo generate && npx hexo deploy
## 正常情况下推送到 GitHub 后会自动构建，不需要手动执行
deploy:
  type: git
  repo: https://github.com/dusash/dusash.github.io.git
  branch: gh-pages
